apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Chirag21-dev/Java-cicd-gitops.git
    targetRevision: main
    path: deployment

  destination:
    server: https://kubernetes.default.svc
    namespace: webapps

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
