apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: webapps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: chiragks1/webapp:1
          ports:
            - containerPort: 8080
          imagePullPolicy: Always
